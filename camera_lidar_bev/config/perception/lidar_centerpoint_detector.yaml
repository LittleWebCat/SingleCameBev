# CenterPoint-PointPillar (OpenPCDet, nuScenes weights) from fresh raw Ouster scans, rendered flat in os_sensor.
# 360 degrees, +-51.2 m, 10 classes. Dimensions/yaw are predictions; Ouster domain accuracy remains provisional.
/**:
  ros__parameters:
    model_type: centerpoint
    input_topic: /points
    output_frame: os_sensor
    detections_topic: /camera_lidar_bev/lidar_detections_3d
    markers_topic: /camera_lidar_bev/lidar_vehicle_markers
    points_topic: /camera_lidar_bev/lidar_vehicle_points
    # nuScenes classes in this project's vocabulary (pedestrian -> person).
    classes: [car, truck, bus, trailer, construction_vehicle, person, motorcycle, bicycle, barrier, traffic_cone]
    # Confidence threshold per class, same order as `classes`. Rare nuScenes classes
    # (trailer, construction vehicle, barrier) false-alarm more on this rig, so they start
    # higher. Initial values: tune on outdoor recordings with known objects.
    #                        car  truck  bus  trailer constr person moto  bike  barrier cone
    class_score_thresholds: [0.30, 0.40, 0.45, 0.50, 0.50, 0.30, 0.35, 0.35, 0.50, 0.40]
    # Used for every class only when class_score_thresholds is empty.
    score_threshold: 0.3
    # Multi-sweep: merge the last 3 scans (nuScenes-style time-lag feature) using per-scan
    # FAST-LIO poses. Needs odometry on odometry_topic (mapping or localization running);
    # without it every scan runs single-sweep. FAST-LIO lags 0.1-0.5 s, so the current
    # scan's pose is predicted at most pose_predict_max_s ahead: rotation from the Ouster
    # gyro on imu_topic (bias estimated online), translation at constant velocity. Stored
    # sweeps switch to the measured pose when it arrives. Offline on the Oct 10 drive with
    # 0.7 s lag: alignment ~7 cm / 0.2 deg median. Multi-sweep there: +11 points persistent
    # boxes, -7 points isolated boxes, ~2.5x detector time.
    sweeps: 3
    sweep_max_span_s: 0.35
    pose_predict_max_s: 0.8
    use_imu_gyro: true
    imu_topic: /imu
    odometry_topic: /camera_lidar_bev/mapping/odometry
    max_publish_hz: 20.0
    stale_after_s: 0.5
    # Model intensity = reflectivity (0..255), the same scale as nuScenes intensity.
    intensity_field: reflectivity
    intensity_scale: 255.0
    # Ouster is about 1.8 m above ground, close to the nuScenes LIDAR_TOP (about 1.84 m).
    z_offset_m: 0.0
    min_forward_m: -51.2
    max_forward_m: 51.2
    # Same measured vehicle/mount envelope as the ground processor; mirrors excluded.
    self_mask_enabled: true
    self_mask_min_x_m: -2.131
    self_mask_max_x_m: 2.350
    self_mask_min_y_m: -0.905
    self_mask_max_y_m: 0.885
    self_mask_min_z_m: -1.800
    self_mask_max_z_m: 0.0
