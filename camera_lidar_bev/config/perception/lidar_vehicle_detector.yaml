# PointPillars car/person inference from fresh raw Ouster scans, rendered flat in os_sensor.
# KITTI-trained dimensions are predictions; Ouster domain accuracy remains provisional.
/**:
  ros__parameters:
    input_topic: /points
    output_frame: os_sensor
    detections_topic: /camera_lidar_bev/lidar_detections_3d
    markers_topic: /camera_lidar_bev/lidar_vehicle_markers
    points_topic: /camera_lidar_bev/lidar_vehicle_points
    classes: [car, person]
    score_threshold: 0.35
    max_publish_hz: 20.0
    stale_after_s: 0.5
    intensity_field: reflectivity
    intensity_scale: 255.0
    max_forward_m: 60.0
    # Same measured vehicle/mount envelope as the ground processor; mirrors excluded.
    self_mask_enabled: true
    self_mask_min_x_m: -2.131
    self_mask_max_x_m: 2.350
    self_mask_min_y_m: -0.905
    self_mask_max_y_m: 0.885
    self_mask_min_z_m: -1.800
    self_mask_max_z_m: 0.0
