# camera_lidar_bev managed DDS transport settings
# Minimum buffer sizes for the project's camera images and original Ouster scans.
# tools/setup_dds_transport.sh retains larger active buffer limits when installing.
net.core.rmem_max = 16777216
net.core.rmem_default = 4194304
net.ipv4.ipfrag_time = 3
net.ipv4.ipfrag_high_thresh = 134217728
