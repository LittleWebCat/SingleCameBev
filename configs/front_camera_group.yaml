# Front camera group assigned by USB port, 2026-10-16.
# Display order: front left, front, front right.
name: Front camera group
input:
  width: 640
  height: 480
  fps: 30
  fourcc: MJPG
cameras:
  - name: Front left
    usb_port: 4.1.3.2
    source: /dev/v4l/by-path/platform-a80aa10000.usb-usb-0:4.1.3.2:1.0-video-index0
  - name: Front
    usb_port: 4.1.2.2
    source: /dev/v4l/by-path/platform-a80aa10000.usb-usb-0:4.1.2.2:1.0-video-index0
  - name: Front right
    usb_port: 4.1.4.4
    source: /dev/v4l/by-path/platform-a80aa10000.usb-usb-0:4.1.4.4:1.0-video-index0
