input:
  width: 1920
  height: 1080
  camera_index_backend: auto

models:
  detector:
    backend: ultralytics
    path: models/yolo_vehicle_fp16.engine
    input_size: 640
    confidence: 0.35
    iou: 0.5
    classes: [person, bicycle, car, motorcycle, bus, truck]
  depth:
    backend: tensorrt
    path: models/depth_anything_v2_small_fp16.engine
    input_size: 518
    cadence: 2
    metric_scale: 1.0
    metric_bias: 0.0
    inverse_depth: false

camera:
  intrinsics:
    fx: 1200.0
    fy: 1200.0
    cx: 960.0
    cy: 540.0
  extrinsics:
    height_m: 1.45
    pitch_deg: 0.0
    yaw_deg: 0.0
    roll_deg: 0.0

bev:
  forward_range_m: 80.0
  lateral_range_m: 20.0
  pixels_per_meter: 10

runtime:
  target_fps: 30
  save_images: true
  max_frames: 0
