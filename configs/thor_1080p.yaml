input:
  width: 800
  height: 600
  fps: 30
  fourcc: MJPG
  camera_index_backend: v4l2

models:
  detector:
    backend: ultralytics
    path: models/yolo_vehicle_fp16.engine
    input_size: 640
    confidence: 0.35
    iou: 0.5
    classes: [person, bicycle, car, motorcycle, bus, truck, stop sign]
  traffic_detector:
    backend: ultralytics
    path: models/traffic_light_state_fp32.engine
    input_size: 640
    confidence: 0.35
    iou: 0.5
    classes: [red, yellow, green]
  depth:
    backend: tensorrt
    path: models/depth_anything_v2_small_fp16.engine
    input_size: 518
    cadence: 2
    metric_scale: 1.0
    metric_bias: 0.0
    inverse_depth: false

camera:
  intrinsics:
    # Approximate scaling of the original 1920x1080 calibration to 800x600.
    # Replace these values with a calibration measured at the capture resolution.
    fx: 500.0
    fy: 666.6667
    cx: 400.0
    cy: 300.0
    calibration_width: 800
    calibration_height: 600
  extrinsics:
    height_m: 1.45
    pitch_deg: 0.0
    yaw_deg: 0.0
    roll_deg: 0.0

bev:
  forward_range_m: 80.0
  lateral_range_m: 40.0
  pixels_per_meter: 10

runtime:
  target_fps: 30
  save_images: true
  max_frames: 0
