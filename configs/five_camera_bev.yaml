# Five-camera fused object/depth BEV: the three front cameras plus left back
# and right back, so the BEV's rear area (up to 40 m) is covered too.
#
# Rig by USB port (re-plugged, verified 2026-09-28):
#   4.1.2.4 left front   (Global Shutter)  -> left
#   4.1.4.4 narrow front (HD USB)          -> middle, runs traffic-light color
#   4.1.4.2 right front  (Global Shutter)  -> right
#   4.1.4.3 left back    (Global Shutter)  -> left_back
#   4.1.3.4 right back   (Global Shutter)  -> right_back
# Four Global Shutter cameras stream at once, which needs the patched uvcvideo
# driver (mjpeg_payload=800, see CameraSetup/uvcvideo_mjpeg_patch).
# Sources use /dev/v4l/by-path so they survive /dev/videoN renumbering.
# Intrinsics, mounting offsets, and yaw angles are initial estimates; the back
# cameras' yaw (+/-120 degrees) is read off their images only. Replace them with
# measured calibration before using BEV distances as ground truth.

input:
  # Corner cameras. The narrow front camera has no 720p mode and overrides
  # this below. Needs the patched uvcvideo driver (mjpeg_payload=800, see
  # CameraSetup/uvcvideo_mjpeg_patch) only when more than two Global Shutter
  # cameras stream at once.
  width: 1280
  height: 720
  fps: 20
  fourcc: MJPG  # YUYV x3 exceeds the shared USB 2.0 bandwidth
  camera_index_backend: v4l2

models:
  detector:
    backend: ultralytics
    path: models/yolo_vehicle_fp16.engine
    input_size: 640
    confidence: 0.35
    iou: 0.5
    classes: [person, bicycle, car, motorcycle, bus, truck, stop sign]

  # This model is invoked only for a camera with traffic_color: true.
  traffic_detector:
    backend: ultralytics
    path: untested_model/best.engine
    input_size: 640
    confidence: 0.35
    iou: 0.5
    classes: [red, yellow, green]

  depth:
    backend: tensorrt
    path: models/depth_anything_v2_small_fp16.engine
    input_size: 518
    # Camera updates are staggered across cadence phases after initialization.
    cadence: 2
    metric_scale: 0.5
    metric_bias: 0.0
    inverse_depth: false

camera:
  intrinsics:
    # Corner (Global Shutter) cameras at 1280x720. Their 720p mode is WIDER
    # than 640x480, not just larger: feature matching between the two modes
    # (2026-09-25) shows 640x480 = the 720p view scaled 1/1.667, missing about
    # 106 px on each side and gaining 40 px top and bottom. So the old 90-degree
    # estimate at 640x480 (fx 320) becomes fx 320 x 1.667 = 533 at 720p
    # (about 100 degrees), with the principal point still centered. Scaling
    # 640x480 values straight to 1280x720 would give fx 640 / fy 480 instead.
    # Still an estimate: calibrate before trusting BEV distances.
    fx: 533.4
    fy: 533.4
    cx: 640.0
    cy: 360.0
    calibration_width: 1280
    calibration_height: 720
  extrinsics:
    height_m: 1.45
    pitch_deg: 0.0
    yaw_deg: 0.0
    roll_deg: 0.0
    lateral_offset_m: 0.0
    forward_offset_m: 0.0

cameras:
  - name: left
    source: /dev/v4l/by-path/platform-a80aa10000.usb-usb-0:4.1.2.4:1.0-video-index0
    traffic_color: false
    extrinsics:
      yaw_deg: -90.0  # points straight left (set 2026-09-28)
      lateral_offset_m: -0.65
      forward_offset_m: 0.0

  - name: middle
    source: /dev/v4l/by-path/platform-a80aa10000.usb-usb-0:4.1.4.4:1.0-video-index0
    traffic_color: true
    input:
      width: 1024  # no 1280x720 MJPG mode; 1024x768 is its sharpest at 30 FPS
      height: 768
      fps: 30
    intrinsics:
      # Narrow lens: approximate 65-degree horizontal field of view at 640x480.
      # Its 1024x768 mode is exactly 640x480 scaled 1.6x (measured), so these
      # 640x480 values scale correctly to 1024x768.
      fx: 500.0
      fy: 500.0
      cx: 320.0
      cy: 240.0
      calibration_width: 640
      calibration_height: 480
    extrinsics:
      yaw_deg: 0.0
      lateral_offset_m: 0.0
      forward_offset_m: 0.15

  - name: right
    source: /dev/v4l/by-path/platform-a80aa10000.usb-usb-0:4.1.4.2:1.0-video-index0
    traffic_color: false
    extrinsics:
      yaw_deg: 90.0  # points straight right (set 2026-09-28)
      lateral_offset_m: 0.65
      forward_offset_m: 0.0

  - name: left_back
    source: /dev/v4l/by-path/platform-a80aa10000.usb-usb-0:4.1.4.3:1.0-video-index0
    traffic_color: false
    extrinsics:
      yaw_deg: -120.0  # rear-left corner; estimate
      lateral_offset_m: -0.65
      forward_offset_m: 0.0

  - name: right_back
    source: /dev/v4l/by-path/platform-a80aa10000.usb-usb-0:4.1.3.4:1.0-video-index0
    traffic_color: false
    extrinsics:
      yaw_deg: 120.0  # rear-right corner; estimate
      lateral_offset_m: 0.65
      forward_offset_m: 0.0

bev:
  forward_range_m: 80.0
  rear_range_m: 40.0
  lateral_range_m: 80.0
  pixels_per_meter: 5

bev_view:
  # What the BEV window shows: 20 m behind to 40 m ahead, 20 m to each side.
  # Only the drawing changes; detection, the semantic matrix and tracking
  # still use the full bev area above.
  forward_range_m: 40.0
  rear_range_m: 20.0
  lateral_range_m: 40.0  # total width: -20 m (left) to +20 m (right)
  pixels_per_meter: 10   # 400 x 600 px window

runtime:
  target_fps: 20
  save_images: true
  save_matrices: true
  max_frames: 0
