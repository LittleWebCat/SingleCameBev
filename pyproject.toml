[project]
name = "single-camera-bev-depth"
version = "0.1.0"
description = "Single dashcam object detection with depth-assisted front BEV projection."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pyserial>=3.5",
]

[project.optional-dependencies]
models = [
  "ultralytics>=8.0",
  "torch>=2.0",
  "timm>=0.9",
]
test = [
  "pytest>=7.0",
]

[project.scripts]
bev-depth-infer = "bev_depth.infer:main"

[tool.setuptools.packages.find]
include = ["bev_depth*"]
